# CR_AGENTIC continuous deploy.
#
# On push to the cr-agentic branch, assume an AWS role via GitHub OIDC and use
# SSM Run Command to tell the EC2 box to pull the latest code and redeploy.
# The heavy docker build runs ON the instance; the runner only orchestrates.
#
# This file is deployed to the branch root as .github/workflows/deploy-ssm.yml
# (a copy is kept here under infra/ci for reference/editing).
#
# Prerequisites (one-time):
#   1. Run CR_AGENTIC/infra/cloudshell/setup-gha-oidc.sh in CloudShell to create
#      the OIDC provider + deploy role, and note the printed Role ARN.
#   2. The EC2 box must be able to `git pull` on its own (read-only deploy key).
#   3. Set the role ARN below (or as repo variable AWS_DEPLOY_ROLE_ARN).

name: Deploy CR_AGENTIC

on:
  push:
    branches: [cr-agentic]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: cr-agentic-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-0ec63ce951829039d
      ROLE_ARN: arn:aws:iam::887731515131:role/cr-agentic-gha-deploy
      REPO_SLUG: buchion/courserep_backend
      DEPLOY_BRANCH: cr-agentic
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger remote deploy via SSM
        run: |
          set -euo pipefail
          cat > params.json <<JSON
          {
            "commands": ["runuser -l ubuntu -c 'cd ~/courserep_backend && git remote set-url origin git@github.com:${REPO_SLUG}.git && git fetch origin ${DEPLOY_BRANCH} && git checkout ${DEPLOY_BRANCH} && git pull --ff-only origin ${DEPLOY_BRANCH} && cd CR_AGENTIC/docker && ./deploy.sh'"],
            "executionTimeout": ["7200"]
          }
          JSON

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GHA deploy ${GITHUB_SHA:0:7}" \
            --parameters file://params.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CID"

          # Poll until the command reaches a terminal state.
          while true; do
            sleep 20
            ST=$(aws ssm get-command-invocation \
                   --command-id "$CID" --instance-id "$INSTANCE_ID" \
                   --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $ST"
            case "$ST" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Remote deploy $ST"
                echo "----- stderr -----"
                aws ssm get-command-invocation --command-id "$CID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text || true
                exit 1 ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CID" \
            --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
