name: CR_AGENTIC Deploy

on:
  push:
    branches: [main]
    paths:
      - "CR_AGENTIC/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  NAME_PREFIX: cr-agentic
  ECS_CLUSTER: cr-agentic-cluster

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CR_AGENTIC
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    strategy:
      matrix:
        service: [agent-api, browser-worker, ai-worker, discovery-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "image_tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          REPO="$REGISTRY/$NAME_PREFIX/${{ matrix.service }}"
          docker build -f "docker/${{ matrix.service == 'browser-worker' && 'playwright' || matrix.service }}.Dockerfile" \
            -t "$REPO:$TAG" -t "$REPO:latest" .
          docker push "$REPO:$TAG"
          docker push "$REPO:latest"

  migrate:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Prisma migrate deploy (one-off ECS task)
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$NAME_PREFIX-migrate" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_APP_SUBNETS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          test "$EXIT_CODE" = "0"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent-api, browser-worker, ai-worker, discovery-worker]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "${{ matrix.service }}" \
            --force-new-deployment
